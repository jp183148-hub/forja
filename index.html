<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FORJA — Área do Aluno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FORJA — Design System da plataforma
   Extraído da página de vendas: Big Shoulders Display + Inter, preto e
   off-white, dourado sóbrio como destaque, cantos de 2px, linhas finas,
   brilho dourado sutil e textura diagonal para profundidade.
   ===================================================================== */
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#EFECE4;
  --text:#14140F; --muted:#5C5A54; --muted-2:#837F76;
  --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.18);
  --gold:#9C7A1F; --gold-fill:#C9A24A; --on-gold:#0A0A0B; --gold-soft:rgba(156,122,31,.12);
  --danger:#A83A2E; --danger-soft:rgba(168,58,46,.09);
  --shadow:0 20px 50px rgba(0,0,0,.10);
  --radius:2px;
  --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0B; --surface:#131315; --surface-2:#1A1A1D;
    --text:#F3F1EA; --muted:#9A9893; --muted-2:#6E6C68;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --gold:#C9A24A; --gold-fill:#C9A24A; --gold-soft:rgba(201,162,74,.14);
    --danger:#D9705F; --danger-soft:rgba(217,112,95,.1);
    --shadow:0 20px 60px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --surface:#131315; --surface-2:#1A1A1D;
  --text:#F3F1EA; --muted:#9A9893; --muted-2:#6E6C68;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --gold:#C9A24A; --gold-fill:#C9A24A; --gold-soft:rgba(201,162,74,.14);
  --danger:#D9705F; --danger-soft:rgba(217,112,95,.1);
  --shadow:0 20px 60px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit}
p{margin:0 0 12px}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:700;line-height:1.02;letter-spacing:.01em}
h1{font-size:clamp(34px,8.4vw,54px)}
h2{font-size:clamp(24px,5.4vw,32px)}
h3{font-size:21px}
.t-body{font-family:var(--font-body);letter-spacing:0;line-height:1.35;font-size:16.5px;font-weight:600}
.kicker{font-size:13px;font-weight:600;color:var(--gold);margin:0 0 12px}
.label-caps{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.lead{font-size:17px;color:var(--muted);max-width:600px;line-height:1.65;margin:16px 0 0}
.muted{color:var(--muted)}.faint{color:var(--muted-2)}.small{font-size:14px}.xs{font-size:12.5px}
.num{font-family:var(--font-display);font-weight:700;color:var(--gold);letter-spacing:.01em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.center{text-align:center}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100%}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.sidebar{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:4px;height:60px;padding:0 10px 0 20px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .grow{flex:1}
.content{width:100%;max-width:1080px;margin:0 auto;padding:28px 20px 128px;overflow-x:clip}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--border-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;padding:8px 2px;font-size:11px;font-weight:600;color:var(--muted-2);text-decoration:none}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .ic{color:var(--gold)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--gold)}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px;border-left:2px solid transparent;transition:color .18s ease,background .18s ease}
.side-link:hover{color:var(--text);background:var(--surface-2)}
.side-link[aria-current="page"]{color:var(--text);border-left-color:var(--gold);background:var(--surface)}
.side-link[aria-current="page"] .ic{color:var(--gold)}
.side-brand{padding:6px 14px 28px}
.side-sep{height:1px;background:var(--border);margin:14px 14px}
.side-foot{margin-top:auto;padding:16px 14px 0;border-top:1px solid var(--border);display:grid;gap:12px}
@media (min-width:960px){
  .sidebar{display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;width:260px;flex:none;padding:24px 12px 20px;border-right:1px solid var(--border);background:var(--bg);overflow-y:auto}
  .tabbar,.topbar .brand{display:none}
  .topbar{padding:0 32px 0 48px}
  .content{padding:44px 48px 80px}
}
.mode-chip{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted-2);line-height:1.45}
.mode-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none}
.demo-note{padding:9px 20px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface)}
.demo-note b{color:var(--gold);font-weight:600}
@media (min-width:960px){.demo-note{padding:9px 48px}}

/* ---------- Marca ---------- */
.brand{display:inline-flex;flex-direction:column;text-decoration:none;color:var(--text);line-height:1}
.wordmark{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:.03em;line-height:1}
.wordmark .dot{color:var(--gold)}
.brand small{display:block;margin-top:6px;font-size:12px;color:var(--muted-2);font-weight:500}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 24px;border-radius:var(--radius);border:1px solid var(--border-strong);background:transparent;color:var(--text);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--border-strong);color:var(--text);transform:none}
.btn-gold{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.btn-gold:hover{color:var(--on-gold);border-color:var(--gold-fill);transform:translateY(-1px)}
.btn-gold:disabled{color:var(--on-gold);border-color:var(--gold-fill)}
.btn-quiet{border-color:transparent}
.btn-quiet:hover{border-color:transparent;background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.btn-sm{min-height:36px;padding:0 16px;font-size:13.5px}
.btn-icon{width:44px;min-height:44px;padding:0}
.btn-icon.btn-sm{width:36px}
.btn-block{width:100%}
.btn .ic{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- Estrutura ---------- */
.page-head{margin-bottom:32px}
.page-head .lead{margin-top:14px}
.sec{padding-top:40px;margin-top:40px;border-top:1px solid var(--border)}
.sec-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-size:clamp(24px,5vw,30px)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card-strong{border-color:var(--border-strong)}
.card-gold{border-color:var(--gold)}
.stack{display:grid;gap:14px}
.split{display:grid;gap:14px}
@media (min-width:760px){.split{grid-template-columns:1fr 1fr}}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;margin:-4px 0 18px}
.back .ic{width:16px;height:16px}
.back:hover{color:var(--gold)}

/* Grade de linhas finas (como "Na prática" da página de vendas) */
.cells{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);grid-template-columns:1fr 1fr}
.cells > *{background:var(--surface);padding:20px 18px;min-width:0}
@media (min-width:760px){.cells.c3{grid-template-columns:repeat(3,1fr)}.cells.c4{grid-template-columns:repeat(4,1fr)}}
.cells.c1{grid-template-columns:1fr}
.cell-k{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:8px}
.cell-v{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1;letter-spacing:.01em}
.cell-v small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted-2);margin-left:6px;letter-spacing:0}
.cell-t{font-weight:600;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.cell-sub{font-size:12.5px;color:var(--muted-2);margin-top:6px}

/* Brilho dourado + entrada (hero) */
@media (min-width:960px){.hero::before{top:-44px;left:-48px;right:-48px}}
.hero{position:relative;padding:8px 0 4px}
.hero::before{content:"";position:absolute;inset:-28px -20px auto -20px;height:360px;background:radial-gradient(520px 300px at 8% 0%,var(--gold-soft),transparent 62%);pointer-events:none;z-index:0}
.hero > *{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--border);padding:7px 14px;border-radius:99px;margin-bottom:24px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.fade{opacity:0;animation:fadeUp .7s ease forwards}
.fade.d1{animation-delay:.08s}.fade.d2{animation-delay:.18s}.fade.d3{animation-delay:.3s}.fade.d4{animation-delay:.42s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}}

/* ---------- Próximo encontro (textura do quadro de vídeo da página de vendas) ---------- */
.feature{position:relative;border:1px solid var(--gold);background:var(--surface);padding:26px 22px;overflow:hidden;box-shadow:var(--shadow)}
.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 48%,var(--gold-soft) 100%),repeating-linear-gradient(115deg,transparent 0 38px,var(--border) 38px 39px);opacity:.55;pointer-events:none}
.feature > *{position:relative;z-index:1}
.feature .when{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.feature .day{font-family:var(--font-display);font-size:clamp(40px,11vw,64px);font-weight:800;line-height:.95;letter-spacing:.01em}
.feature .time{font-family:var(--font-display);font-size:clamp(22px,5.4vw,30px);font-weight:600;color:var(--muted)}
.feature .theme{font-size:18px;font-weight:600;line-height:1.4;margin:16px 0 0;max-width:40ch}
.feature .meta{display:grid;gap:10px;margin:20px 0 0;padding:18px 0 0;border-top:1px solid var(--border)}
.feature .meta div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--muted)}
.feature .meta .ic{width:18px;height:18px;color:var(--gold);margin-top:2px}
.feature .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
@media (min-width:760px){.feature{padding:34px 36px}}
.feature.empty-f{border-color:var(--border-strong);box-shadow:none}

/* ---------- Pills e marcas de estado ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--border-strong);color:var(--muted);white-space:nowrap;line-height:1.35}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill .ic{width:14px;height:14px}
.pill.gold{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.pill.solid{border-color:var(--gold-fill);background:var(--gold-fill);color:var(--on-gold)}
.pill.danger{border-color:transparent;background:var(--danger-soft);color:var(--danger)}
.pill.test{border-style:dashed;color:var(--muted-2)}
.pill.live{border-color:var(--gold);color:var(--gold)}
.pill.live .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}
.mark{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;color:var(--gold)}
.mark .ic{width:13px;height:13px}
.mark.done{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.mark.wait{border-color:var(--gold)}
.mark.half{border-color:var(--gold)}
.mark.half::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.mark.next{border:1.5px solid var(--gold);background:transparent}
.state{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.state.concluido{color:var(--gold)}
.state.andamento,.state.proximo{color:var(--text)}
.state .mark{width:20px;height:20px}
.state .mark .ic{width:11px;height:11px}
.state .mark.half::after{width:7px;height:7px}

/* ---------- Medidor por etapa (12 módulos) ---------- */
.gauge{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.seg{height:12px;border-radius:1px;background:var(--surface-2);border:1px solid var(--border);position:relative;overflow:hidden}
.seg.locked{background:transparent;border-style:dashed}
.seg i{position:absolute;inset:0 auto 0 0;width:var(--w,0%);background:var(--gold-fill);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.gauge.big .seg{height:26px}
.gauge-idx{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px;font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--muted-2);text-align:center}
@media (prefers-reduced-motion:reduce){.seg i{transition:none}}
.bar{height:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-fill)}

/* ---------- Listas ---------- */
.rows{border-top:1px solid var(--border)}
.dash-list{list-style:none;margin:0;padding:0}
.dash-list li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:15px}
.dash-list li:first-child{border-top:0;padding-top:0}
.dash-list li::before{content:"—";color:var(--gold);flex:none}
.enc-list{border-top:1px solid var(--border)}
.enc{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:18px 2px;border-bottom:1px solid var(--border);text-decoration:none}
a.enc:hover{background:var(--surface)}
.enc .n{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.enc.past .n{color:var(--muted-2)}
.enc .d{font-size:13px;color:var(--muted);margin-bottom:3px}
.enc .t{font-weight:600;font-size:15.5px;line-height:1.35}
.enc .who{font-size:13px;color:var(--muted-2);margin-top:3px}
.enc.cancel .t{text-decoration:line-through;color:var(--muted)}
.lrow{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--border)}
.lrow .body{flex:1;min-width:0}
.lrow .body > strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .body > strong .pill{margin-left:6px;vertical-align:1px}
.lrow .body > span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.lrow{text-decoration:none}
a.lrow:hover{background:var(--surface)}
.lrow.pending{background:var(--gold-soft);padding-left:12px;padding-right:12px;border-bottom-color:transparent;margin-bottom:2px}

.cells.sc-grid{grid-template-columns:1fr}
@media (min-width:560px){.cells.sc-grid{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.cells.sc-grid{grid-template-columns:repeat(3,1fr)}}
.sc{display:flex;gap:14px;align-items:flex-start;text-decoration:none;transition:background .18s ease}
.cells > a.sc:hover{background:var(--surface-2)}
.sc .ic{color:var(--gold);width:22px;height:22px;margin-top:1px}
.sc strong{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
.sc span{font-size:13.5px;color:var(--muted);line-height:1.45}

/* ---------- Trilha ---------- */
.method{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin:26px 0 12px}
@media (min-width:760px){.method{grid-template-columns:repeat(4,1fr)}}
.method > div{background:var(--surface);padding:18px}
.method span.num{font-size:15px;display:block;margin-bottom:8px;color:var(--gold)}
.method strong{display:block;font-size:15.5px;font-weight:600}
.method span{font-size:13px;color:var(--muted)}
.ratio{display:flex;height:30px;margin:14px 0 0;font-size:12.5px;font-weight:600;border:1px solid var(--border-strong)}
.ratio div{display:flex;align-items:center;padding:0 12px;white-space:nowrap}
.ratio .t{flex:20;color:var(--muted)}
.ratio .p{flex:80;background:var(--gold-fill);color:var(--on-gold)}
.track{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.trk{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:22px 2px;border-bottom:1px solid var(--border);text-decoration:none}
a.trk:hover{background:var(--surface)}
.trk .num{font-size:30px;line-height:1}
.trk.planejado .num{color:var(--muted-2)}
.trk h3{font-size:22px;margin-bottom:6px}
.trk .sum{display:block;font-size:14px;color:var(--muted);margin-bottom:12px;max-width:62ch}
.trk .foot{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.trk .bar{width:120px}
.trk .meta{font-size:12.5px;color:var(--muted-2)}
.h-num{color:var(--gold);margin-right:12px}
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.lesson{display:flex;gap:14px;align-items:center;padding:15px 2px;border-bottom:1px solid var(--border);text-decoration:none}
a.lesson:hover{background:var(--surface)}
.lesson .t{flex:1;min-width:0;font-weight:500}
.lesson .n{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--muted-2);width:24px;flex:none}

/* ---------- Conteúdo (material de apoio) ---------- */
.lstatus{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.block{padding:28px 0;border-top:1px solid var(--border)}
.block > h2{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:26px}
.tag{font-family:var(--font-body);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--border-strong);border-radius:99px;padding:2px 9px}
.tag.p{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.block.concept p{color:var(--muted);max-width:62ch}
.block p{max-width:66ch}

.table-wrap{overflow-x:auto;border:1px solid var(--border);background:var(--surface)}

th{text-align:left;font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:13px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}

details.mod-acc{border-bottom:1px solid var(--border)}

.acc-body{padding:0 0 16px}
.hm td{padding:9px 6px;text-align:center}

.hm td:first-child,.hm th:first-child{text-align:left;padding-left:16px;position:sticky;left:0;background:var(--surface);z-index:1}

.hm a{text-decoration:none}
.hm a:hover strong{color:var(--gold)}
a.att:hover{outline:1px solid var(--gold)}
.seg-btns button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border-left:1px solid var(--border-strong)}

.seg-btns button[aria-pressed="true"][data-v="presente"]{background:var(--gold-fill);color:var(--on-gold)}

.editor-list{border-top:1px solid var(--border)}

.days{display:flex;gap:6px;flex-wrap:wrap}

.field{display:grid;gap:7px;margin-bottom:18px}

.grid2{display:grid;gap:0 18px}

fieldset{border:0;padding:0;margin:0 0 24px;min-width:0}

/* ---------- Entrar e cadastro ---------- */
.auth{min-height:100%;display:grid}
.auth-side{position:relative;padding:28px 20px 12px;overflow:hidden}
.auth-side::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 300px at 10% 0%,var(--gold-soft),transparent 62%);pointer-events:none}

.auth-statement{font-family:var(--font-display);font-size:clamp(40px,11vw,78px);font-weight:800;line-height:.98;letter-spacing:.01em;margin:40px 0 16px;max-width:12ch}

}
.stepper{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0;margin:0 0 30px}
.stepper li{font-size:12px;color:var(--muted-2);font-weight:600}
.stepper li::before{content:"";display:block;height:2px;background:var(--border-strong);margin-bottom:10px}
.stepper li.on{color:var(--text)}

.form-actions{display:flex;gap:10px;justify-content:space-between;margin-top:26px;flex-wrap:wrap}
.form-actions .btn-gold{flex:1 1 180px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer}
.consent input{width:20px;height:20px;accent-color:var(--gold-fill);flex:none;margin:1px 0 0}

/* ---------- Avisos, toast e modal ---------- */
.notice{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--gold)}

.toast{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);border-left:2px solid var(--gold);padding:12px 18px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fadeUp .25s ease}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}

.warn .small{display:block;color:var(--text);font-weight:400}

}

// =====================================================================
// Store — traduz uma escrita local (tabela + operação + linha) numa
// escrita real no Supabase. As telas mutam o objeto DB local primeiro
// (resposta instantânea) e chamam isto para sincronizar; se a escrita
// falhar, avisamos e recarregamos a verdade do banco.
// =====================================================================
const TABLE_MAP = {
  students: { table: 'students', out: r => (isAdmin() ? { ...outStudentSelf(r), ...outStudentAdmin(r) } : outStudentSelf(r)) },
  student_profiles: { table: 'student_profiles', out: outProfile, key: 'student_id' },
  modules: { table: 'modules', out: outModule },
  lessons: { table: 'lessons', out: outLesson },
  materials: { table: 'materials', out: outMaterial },
  library_entries: { table: 'library_entries', out: outLibrary },
  announcements: { table: 'announcements', out: outAnn },
  admin_notes: { table: 'admin_notes', out: r => ({ body: r.body || '' }), key: 'student_id' },
  cohorts: { table: 'cohorts', out: outCohort },
  assessments: { table: 'assessments', out: r => ({ module_id: r.module_id, title: r.title, description: r.description || '' }) }
};
async function resync(msg) {
  try { await loadAll(); } catch (e) { /* mantém o que já tinha na tela */ }
  if (msg) toast(msg);
  render();
}
const Store = {
  async commit(table, op, row) {
    if (table === 'ai_conversations') return; // sem IA ligada ainda, nada para sincronizar
    const map = TABLE_MAP[table];
    if (!map) { console.error('Store.commit: tabela desconhecida', table); return; }
    const key = map.key || 'id';
    try {
      if (op === 'delete') {
        const { error } = await sb.from(map.table).delete().eq(key, row[key]);
        if (error) throw error;
        return;
      }
      const payload = map.out(row);
      if (key !== 'id') payload[key] = row[key]; else payload.id = row.id;
      const { data, error } = await sb.from(map.table).upsert(payload, { onConflict: key }).select().maybeSingle();
      if (error) throw error;
      if (data && key === 'id' && !row.id) row.id = data.id; // pega o id gerado pelo banco quando criamos sem um
    } catch (e) {
      console.error('Falha ao salvar', table, e);
      await resync('Não foi possível salvar essa alteração agora. A tela foi atualizada com o que está salvo no banco.');
    }
  }
};

const byStart = (a, b) => encStart(a) - encStart(b);
const encountersFor = sid => DB.encounters.filter(e => e.participants.includes(sid)).sort(byStart);
const isUpcoming = e => (e.status === 'agendado' || e.status === 'remarcado') && encEnd(e) >= new Date();
const needsAttendance = e => (e.status === 'agendado' || e.status === 'remarcado') && encEnd(e) < new Date();
const isLive = e => isUpcoming(e) && encStart(e) <= new Date();
const nextEncounterOf = sid => encountersFor(sid).find(isUpcoming) || null;
const encIndex = (e, sid) => { const list = encountersFor(sid).filter(x => x.status !== 'cancelado'); return list.findIndex(x => x.id === e.id) + 1; };
function attendanceOf(sid) {
  const list = encountersFor(sid).filter(e => e.status !== 'cancelado');
  const held = list.filter(e => e.status === 'realizado');
  const count = k => held.filter(e => e.attendance[sid] === k).length;
  const pres = count('presente');
  return { total: list.length, held: held.length, pres, just: count('justificada'), falt: count('falta'), pct: held.length ? Math.round(pres / held.length * 100) : null, hours: held.filter(e => e.attendance[sid] === 'presente').reduce((a, e) => a + hoursOf(e), 0) };
}
const assessmentsAll = () => (DB.assessments || []).slice().sort((a, b) => ((getModule(a.module_id) || {}).position || 99) - ((getModule(b.module_id) || {}).position || 99));
const assessResult = (sid, aid) => (DB.assessment_results || []).find(r => r.student_id === sid && r.assessment_id === aid) || null;
function assessSummary(sid) { const all = assessmentsAll(); const res = all.map(a => assessResult(sid, a.id)); return { total: all.length, approved: res.filter(r => r && r.result === 'aprovado').length, redo: res.filter(r => r && r.result === 'refazer').length }; }
function moduleState(m, x, next, sid) {
  if (x && x.total && x.done === x.total) return 'concluido';
  if (next && next.module_id === m.id) return 'proximo';
  const worked = DB.encounters.some(e => e.module_id === m.id && e.status === 'realizado' && (!sid || e.participants.includes(sid)));
  if ((x && x.done > 0) || worked) return 'andamento';
  return 'planejado';
}

function statsFor(sid) {
  const prog = new Map(DB.progress.filter(p => p.student_id === sid).map(p => [p.lesson_id, p]));
  let total = 0, done = 0, pending = 0, challenges = 0;
  const perModule = modulesAll().map(m => {
    const ls = lessonsOf(m.id); let d = 0;
    ls.forEach(l => {
      const p = prog.get(l.id);
      if (p && p.status === 'concluida') { d++; if (l.challenge) challenges++; }
      else if (p && p.status === 'aguardando') pending++;
    });
    total += ls.length; done += d;
    return { m, total: ls.length, done: d, pct: ls.length ? d / ls.length : 0 };
  });
  return { total, done, pending, challenges, pct: total ? Math.round(done / total * 100) : 0, perModule, modulesDone: perModule.filter(x => x.total && x.done === x.total).length, prog };
}
function planModuleId(n) { const m = modulesAll()[n - 1]; return m ? m.id : null; }
function generateDates(slots, fromDate, count) {
  const out = []; const d = parseDay(fromDate); let guard = 0;
  while (out.length < count && guard++ < 800) {
    const slot = slots.find(x => x.wd === d.getDay());
    if (slot) out.push({ date: isoDate(d), start: slot.start, end: slot.end });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

// =====================================================================
// Ações que exigem privilégio elevado (redefinir senha de aluno, excluir
// a conta de login de um aluno) passam por uma Edge Function no Supabase.
// O navegador nunca vê a chave "secret" — só manda o próprio token de
// administrador logado, e a função confere no servidor se ele é mesmo
// admin antes de agir. Enquanto a função não estiver publicada, essas
// duas ações mostram um aviso claro em vez de falhar silenciosamente.
// =====================================================================
async function callAdminFn(action, payload) {
  const { data: { session } = {} } = await sb.auth.getSession();
  if (!session) throw new Denied('Sessão expirada. Entre novamente.');
  let res;
  try {
    res = await fetch(ENV.url.replace(/\/$/, '') + '/functions/v1/admin-actions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ action, ...payload })
    });
  } catch (e) { throw new Error('Não foi possível falar com o servidor agora. Confira sua internet e tente de novo.'); }
  if (res.status === 404) throw new Error('Essa função ainda não foi publicada no Supabase. Veja o guia de implantação para ativá-la.');
  let out = {}; try { out = await res.json(); } catch (e) { /* resposta vazia */ }
  if (!res.ok) throw new Error(out.error || 'O servidor recusou essa operação.');
  return out;
}

const API = {
  // ---------- Conta ----------
  async signUp(d) {
    const email = d.email.trim().toLowerCase();
    const err = passError(d.password); if (err) throw new Error(err);
    const { data: signData, error: signErr } = await sb.auth.signUp({ email, password: d.password });
    if (signErr) {
      if (/registered|already/i.test(signErr.message)) throw new Error('Este e-mail já tem cadastro. Entre com sua senha.');
      throw new Error(signErr.message);
    }
    // Supabase não avisa por erro quando o e-mail já existe (evita revelar quem já é cadastrado):
    // sinaliza isso devolvendo um usuário sem nenhuma "identity" e sem sessão.
    if (signData.user && Array.isArray(signData.user.identities) && !signData.user.identities.length) {
      throw new Error('Este e-mail já tem cadastro. Entre com sua senha.');
    }
    if (!signData.session) throw new Error('Não foi possível concluir o cadastro agora. Tente novamente em instantes.');
    await refreshAuth();
    const sid = newId();
    const { error: stErr } = await sb.from('students').insert({
      id: sid, user_id: AUTH_USER.id, full_name: d.full_name.trim(),

  let control;
  if (o.type === 'textarea') control = `<textarea id="${id}" name="${name}" ${o.tall ? 'class="tall"' : ''} ${o.attrs || ''}>${esc(v)}</textarea>`;
  else if (o.type === 'select') control = `<select id="${id}" name="${name}" ${o.attrs || ''}>${o.noEmpty ? '' : `<option value="">${esc(o.empty || 'Selecione')}</option>`}${o.options.map(x => `<option value="${esc(x.k)}" ${x.k === v ? 'selected' : ''}>${esc(x.l)}</option>`).join('')}</select>`;
  else control = `<input id="${id}" name="${name}" type="${o.type || 'text'}" value="${esc(v)}" ${o.attrs || ''}>`;
  return `<div class="field ${o.cls || ''} ${err ? 'invalid' : ''}"><label for="${id}">${esc(label)}${req ? '' : ' <span class="opt">(opcional)</span>'}</label>${control}${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}<span class="err" role="alert">${esc(err)}</span></div>`;
}
function radios(name, opts, value, legend, err, two) {
  return `<fieldset><legend>${esc(legend)}</legend><div class="choices ${two ? 'two' : ''}" role="radiogroup">${opts.map(o =>
    `<label class="choice"><input type="radio" name="${name}" value="${esc(o.k)}" ${o.k === value ? 'checked' : ''}><span>${esc(o.l)}</span></label>`).join('')}</div><span class="err" role="alert">${esc(err || '')}</span></fieldset>`;
}
function checks(name, opts, values, legend, hint, disabledKey) {
  return `<fieldset><legend>${esc(legend)}</legend>${hint ? `<p class="hint" style="margin:-6px 0 12px">${esc(hint)}</p>` : ''}<div class="choices two">${opts.map(o =>
    `<label class="choice"><input type="checkbox" name="${name}" value="${esc(o.k)}" ${(values || []).includes(o.k) && o.k !== disabledKey ? 'checked' : ''} ${o.k === disabledKey ? 'disabled' : ''}><span>${esc(o.l)}</span></label>`).join('')}</div></fieldset>`;
}
function toast(msg) {
  const box = $('#toast'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;

}
function modalBox(inner, onClose) {
  const el = document.createElement('div'); el.className = 'modal';
  el.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${inner}</div>`;
  const close = v => { document.removeEventListener('keydown', key); el.remove(); onClose(v); };
  const key = ev => { if (ev.key === 'Escape') { ev.preventDefault(); close(null); } };
  document.addEventListener('keydown', key);
  el.addEventListener('click', ev => { const b = ev.target.closest('[data-m]'); if (b) close(b.dataset.m); else if (ev.target === el) close(null); });
  document.body.appendChild(el);
  const f = el.querySelector('[data-m="1"]') || el.querySelector('[data-m]'); if (f) f.focus();
  return el;
}

function md(t) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  esc(t).split('\n').forEach(raw => {
    const line = raw.trim(); let m;
    if ((m = line.match(/^(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[2])}</li>`; }
    else if ((m = line.match(/^[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!line) close();
    else { close(); out += `<p>${inline(line.replace(/^#{1,4}\s+/, ''))}</p>`; }
  });
  close(); return out;
}

function validateSignupStep() {
  const { step, d } = UI.su; const e = {};
  if (step === 1) {
    if (!d.full_name || d.full_name.trim().split(/\s+/).length < 2) e.full_name = 'Informe nome e sobrenome.';
    if (!emailValid(d.email)) e.email = 'Informe um e-mail válido.';
    if (!d.password || d.password.length < 8) e.password = 'Use pelo menos 8 caracteres.';
    if (d.password2 !== d.password) e.password2 = 'As senhas não conferem.';
  } else if (step === 2) {
    if (!d.preferred_name || !d.preferred_name.trim()) e.preferred_name = 'Como devemos chamar você?';
    if (digits(d.phone).length < 10) e.phone = 'Informe DDD e número.';
    if (!cpfValid(d.cpf)) e.cpf = 'CPF inválido. Confira os números.';
    if (!d.birth_date) e.birth_date = 'Informe sua data de nascimento.';
    else if (new Date(d.birth_date) > new Date()) e.birth_date = 'Data inválida.';
    if (!d.address || d.address.trim().length < 5) e.address = 'Informe seu endereço.';
    if (!d.city || !d.city.trim()) e.city = 'Informe sua cidade.';
    if (!d.state) e.state = 'Selecione o estado.';
  } else if (step === 3) {
    if (!d.main_goal) e.main_goal = 'Escolha seu objetivo principal.';
  } else {
    if (!d.experience) e.experience = 'Escolha uma opção.';
    if (!d.equipment) e.equipment = 'Escolha uma opção.';
    if (!d.income_use) e.income_use = 'Escolha uma opção.';
    if (!d.main_difficulty || d.main_difficulty.trim().length < 3) e.main_difficulty = 'Conte sua maior dificuldade.';
    if (!d.learning_wish || d.learning_wish.trim().length < 10) e.learning_wish = 'Escreva pelo menos uma frase. Essa resposta orienta sua formação.';
    if (!d.consent) e.consent = 'É preciso autorizar o uso dos dados para concluir.';
  }
  UI.su.err = e;
  return !Object.keys(e).length;
}

const SEARCH_SUGGESTIONS = ['multímetro', 'fonte', 'curto', 'continuidade', 'bateria', 'conector', 'FPC', 'microfone', 'diagnóstico', 'orçamento', 'cliente', 'solda'];
function searchAll(q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length || norm(q).length < 2) return null;
  const hit = txt => { const h = norm(txt); return terms.every(t => h.includes(t)); };
  const lib = DB.library.filter(e => hit([e.title, e.summary, e.category, ...(e.tags || []), ...(e.steps || []), e.warning].join(' ')));
  const mods = modulesAll().filter(canOpenModule);
  const lessons = mods.flatMap(m => lessonsOf(m.id).map(l => ({ l, m }))).filter(({ l, m }) => hit([l.title, l.concept, l.practice, ...l.steps, ...l.errors, l.challenge, m.title].join(' ')));
  lib.sort((a, b) => hit(b.title) - hit(a.title));
  lessons.sort((a, b) => hit(b.l.title) - hit(a.l.title));
  return { lib, lessons, mods: modulesAll().filter(m => hit(m.title + ' ' + m.summary)) };
}
function searchResults(q) {
  const r = searchAll(q);
  if (!r) return `<p class="label-caps" style="margin:8px 0 12px">Sugestões</p><div class="chips">${SEARCH_SUGGESTIONS.map(t => `<button class="chip" data-act="suggest-search" data-q="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  if (!r.lib.length && !r.lessons.length && !r.mods.length) return `<div class="empty"><p style="margin:0">Nenhum resultado para "${esc(q)}". Tente uma palavra mais curta, como "curto" ou "fonte".</p></div>`;
  const group = (t, items) => items ? `<div class="res-group"><h2>${t}</h2><div class="entries">${items}</div></div>` : '';
  return group('Biblioteca Técnica', r.lib.map(e => `<a class="entry" href="#/ficha/${esc(e.slug)}"><span class="cat">${esc(e.category)}</span><strong>${esc(e.title)}</strong><span class="s">${esc(clip(e.summary, 110))}</span></a>`).join(''))
    + group('Material de apoio', r.lessons.slice(0, 12).map(({ l, m }) => `<a class="entry" href="#/conteudo/${l.id}"><span class="cat">Módulo ${moduleNum(m)}: ${esc(m.title)}</span><strong>${esc(l.title)}</strong>${l.concept ? `<span class="s">${esc(clip(l.concept, 110))}</span>` : ''}</a>`).join(''))
    + group('Trilha', r.mods.map(m => `<a class="entry" href="#/modulo/${m.id}"><span class="cat">Módulo ${moduleNum(m)}</span><strong>${esc(m.title)}</strong><span class="s">${esc(m.summary)}</span></a>`).join(''));
}

function assistantRules(ctx) {
  const s = myStudent(); const p = s ? profileOf(s.id) : {};
  const lvl = s ? LEVELS[levelOf(p.experience)] : 'Intermediário';
  return `Você é o Assistente FORJA, professor auxiliar da FORJA, formação PRESENCIAL em manutenção de celulares (Android e iPhone) com a metodologia "20% teoria, 80% prática". Você apoia o aluno entre os encontros presenciais na bancada; você não substitui o instrutor.

Como responder:
- Português do Brasil, didático, direto e prático. No máximo cerca de 180 palavras.
- Priorize raciocínio diagnóstico: sintoma → hipótese → teste → resultado → próxima hipótese. Nunca responda apenas "troque o componente X".
- Comece pelos testes mais simples, rápidos e baratos. Use passos numerados.
- Termine com UMA pergunta sobre o resultado do teste, para continuar o diagnóstico com o aluno.
- Nível do aluno: ${lvl}. Iniciante: explique termos técnicos em poucas palavras. Avançado: seja objetivo.

Segurança (obrigatório):
- Quando relevante, alerte sobre bateria de lítio (nunca perfurar, dobrar ou aquecer; bateria estufada não se força), polaridade e limite de corrente na fonte, excesso de calor e estática.
- Oriente desconectar a bateria antes de mexer em conectores da placa.
- Não invente tensões, valores de esquema ou códigos de componentes de modelos específicos. Sem certeza, diga isso e oriente consultar o esquema elétrico do aparelho ou o instrutor.
- Se o caso exigir técnica avançada (microsolda avançada, reballing, engenharia de placa), diga claramente e recomende levar ao instrutor no próximo encontro.
- Assuntos fora de manutenção de celulares, atendimento, orçamento ou carreira na área: responda em uma frase e volte ao tema.

Formato: texto simples, passos numerados, **negrito** só para alertas. Sem títulos.
Fichas da Biblioteca FORJA que você pode indicar pelo nome quando ajudarem: ${DB.library.map(e => e.title).join('; ')}.
${ctx ? `Contexto atual do aluno: ${ctx}.` : ''}`;
}

async function askAssistant(text) {
  text = String(text || '').trim();
  if (!text || UI.aiBusy) return;
  if (!CAP.sample) { toast('Assistente indisponível neste acesso.'); return; }
  const c = API.conversation(true);
  c.messages.push({ role: 'user', content: text, at: nowISO() });
  if (UI.aiCtx && !c.context) c.context = UI.aiCtx.text;
  Store.commit('ai_conversations', 'update', c);
  UI.aiBusy = true; UI.aiCtl = new AbortController();
  render();
  const chat = $('#chat');
  if (chat) chat.insertAdjacentHTML('beforeend', `<div class="msg ai" id="ai-live"><span class="who">Assistente FORJA</span><span class="thinking">Pensando…</span></div>`);
  window.scrollTo(0, document.body.scrollHeight);
  const turns = [{ role: 'user', content: assistantRules(UI.aiCtx ? UI.aiCtx.text : c.context) }].concat(c.messages.slice(-12).map(m => ({ role: m.role, content: m.content })));
  let finalText = '', note = '';
  try {
    const res = await CAP.sample(turns, { cache: false, signal: UI.aiCtl.signal, onText: ({ text: t }) => { const el = $('#ai-live'); if (el) el.innerHTML = `<span class="who">Assistente FORJA</span>${md(t)}`; } });
    finalText = res.text || '';
    if (res.truncated) note = 'Resposta cortada. Peça para continuar ou faça uma pergunta mais específica.';
  } catch (e) {
    finalText = (e && e.text) || ''; const code = e && e.code;
    if (code === 'cancelled') note = '';
    else if (code === 'not_granted') { note = 'Uso da IA não autorizado neste acesso.'; CAP.sampleState = 'off'; CAP.sample = null; }
    else if (code === 'rate_limited') note = 'Muitas perguntas seguidas. Aguarde um pouco e envie de novo.';
    else if (code === 'prompt_too_large') note = 'Conversa longa demais. Comece uma nova conversa.';
    else note = 'Não foi possível responder agora. Tente novamente em instantes.';
  }
  if (finalText) c.messages.push({ role: 'assistant', content: finalText, at: nowISO() });
  Store.commit('ai_conversations', 'update', c);
  UI.aiBusy = false; UI.aiCtl = null;
  if (parseHash().path === '/assistente') { render(); window.scrollTo(0, document.body.scrollHeight); }
  if (note) toast(note);
}

function filterStudents() {
  const f = UI.af; const q = norm(f.q);
  return adminRows().filter(({ s, p, st }) => {
    if (q && !norm([s.full_name, s.preferred_name, s.email, s.phone, s.city].join(' ')).includes(q)) return false;
    if (f.goal && p.main_goal !== f.goal) return false;
    if (f.lvl && levelOf(p.experience) !== f.lvl) return false;
    if (f.exp && p.experience !== f.exp) return false;
    if (f.equip && p.equipment !== f.equip) return false;
    if (f.city && s.city !== f.city) return false;
    if (f.status && s.status !== f.status) return false;
    if (f.prog) { const [a, b] = f.prog.split('-').map(Number); if (st.pct < a || st.pct > b) return false; }
    if (f.since && !inDays(s.joined_at, Number(f.since))) return false;
    return true;
  }).sort((a, b) => new Date(b.s.joined_at) - new Date(a.s.joined_at));
}

function currentCohort() { return DB.cohorts.find(c => c.id === UI.cohortId) || activeCohort(); }
function attendanceMatrix(c) {

  const lists = studs.map(s => encountersFor(s.id));

  const cell = (e, sid) => {
    if (!e) return '<span class="att futuro">·</span>';

    if (e.status === 'cancelado') return `<span class="att futuro" title="${esc(t)} (cancelado)">×</span>`;
    const a = e.attendance[sid];
    if (e.status === 'realizado' || a) return `<a class="att ${a || 'pendente'}" href="#/admin/encontro/${e.id}" title="${esc(t)}: ${esc(ATT[a] || 'sem registro')}">${a === 'presente' ? 'P' : a === 'falta' ? 'F' : a === 'justificada' ? 'J' : '!'}</a>`;
    if (needsAttendance(e)) return `<a class="att pendente" href="#/admin/encontro/${e.id}" title="${esc(t)}: lançar presença">!</a>`;
    return `<a class="att futuro" href="#/admin/encontro/${e.id}" title="${esc(t)}">${parseDay(e.date).getDate()}</a>`;
  };
  return `<div class="table-wrap"><table class="hm"><thead><tr><th>Aluno</th>${Array.from({ length: cols }, (_, i) => `<th>${pad2(i + 1)}</th>`).join('')}<th>Presença</th></tr></thead><tbody>
    ${studs.map((s, k) => { const att = attendanceOf(s.id); return `<tr><td><a href="#/admin/aluno/${s.id}"><strong>${esc(s.preferred_name || firstName(s.full_name))}</strong></a></td>${Array.from({ length: cols }, (_, i) => `<td>${cell(lists[k][i], s.id)}</td>`).join('')}<td><strong>${att.pct == null ? '—' : att.pct + '%'}</strong></td></tr>`; }).join('')}
  </tbody></table></div><div class="legend" style="margin-top:12px"><span><span class="att presente" style="width:20px;height:18px;font-size:11px">P</span>Presente</span><span><span class="att falta" style="width:20px;height:18px;font-size:11px">F</span>Falta</span><span><span class="att justificada" style="width:20px;height:18px;font-size:11px">J</span>Justificada</span><span><span class="att pendente" style="width:20px;height:18px;font-size:11px">!</span>Lançar presença</span><span>Número: dia agendado</span></div>`;
}
function conflictsFor(date, start, end, excludeId) {

function exportCSV() {

// Download normal do navegador — não depende mais de estar dentro do artefato do Claude.
async function offerDownload(filename, data) {
  try {
    if (CAP.downloads) { await CAP.downloads.save({ filename, data }); toast('Arquivo pronto.'); return; }
    const blob = new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Arquivo baixado.');
  } catch (e) { if (e && e.code === 'declined') return; toast('Não foi possível gerar o arquivo.'); }
}

const home = () => isAdmin() ? '#/admin' : '#/inicio';
function paint(html) { const app = $('#app'); if (app) app.innerHTML = html; }
function loadAvatarIfNeeded(mt) {
  const s = DB.students.find(x => x.id === mt[1]);
  if (s && s.avatar_path && !s.avatar) ensureAvatar(s).then(got => { if (got && parseHash().path === '/admin/aluno/' + mt[1]) render(); });

function render() {
  const { path, q } = parseHash();
  if (UI.passwordRecovery) { paint(viewPasswordReset()); return; }
  if (!AUTH_USER) {
    paint(path === '/cadastro' ? viewSignup() : viewLogin());
    return;
  }
  if (MY_ROLE === 'student' && !myStudent()) {
    paint(`<div class="empty" style="margin:60px auto;max-width:520px"><h1>Matrícula não encontrada</h1><p>Sua conta existe, mas não encontramos seus dados de aluno. Fale com o instrutor.</p><button class="btn btn-gold" data-act="logout" style="margin-top:14px">Sair</button></div>`);
    return;
  }
  if (['/', '', '/entrar', '/cadastro'].includes(path)) return go(home());
  for (const r of ROUTES) {
    const m = path.match(r.re); if (!m) continue;
    if (r.role === 'admin' && !isAdmin()) { toast('Acesso restrito ao administrador.'); return go('#/inicio'); }
    if (r.role === 'student' && !myStudent()) return go('#/admin');
    let body;
    try { body = r.view(m, q); }
    catch (err) {
      if (err instanceof Denied) { toast(err.message); return go(home()); }
      console.error(err);
      body = `<div class="empty"><h1>Não foi possível abrir esta tela</h1><p>${esc(err.message)}</p><a class="btn" href="${home()}">Voltar ao início</a></div>`;
    }
    paint(shell(body, r.nav));
    if (r.after) r.after(m, q);
    return;
  }
  go(home());
}

  },
  profile(f) {
    const s = mustStudent(); const fd = new FormData(f); const err = $('#profile-err');
    const name = String(fd.get('full_name') || '').trim();
    if (name.split(/\s+/).length < 2) { err.textContent = 'Informe nome e sobrenome.'; return; }

    if (digits(fd.get('phone')).length < 10) { err.textContent = 'Informe telefone com DDD.'; return; }
    try {

      API.updateProfile(s.id, { main_goal: fd.get('main_goal') || '', secondary_goals: fd.getAll('secondary_goals'), experience: fd.get('experience') || '', equipment: fd.get('equipment') || '', income_use: fd.get('income_use') || '', main_difficulty: String(fd.get('main_difficulty') || '').trim(), learning_wish: String(fd.get('learning_wish') || '').trim() });
      toast('Dados atualizados.'); go('#/perfil');
    } catch (e) { err.textContent = e.message; }
  },
  ai(f) { const t = f.querySelector('textarea'); const v = t.value; t.value = ''; askAssistant(v); },
  ask(f) { const fd = new FormData(f); API.ask(fd.get('body'), fd.get('lesson')); UI.askLesson = ''; toast('Dúvida enviada ao instrutor.'); render(); },
  answer(f) { API.answer(f.dataset.q, new FormData(f).get('answer')); toast('Resposta enviada.'); render(); },
  note(f) { mustAdmin(); const body = String(new FormData(f).get('body') || '').trim(); let n = DB.admin_notes.find(x => x.student_id === f.dataset.s); if (!n) { n = { student_id: f.dataset.s }; DB.admin_notes.push(n); } n.body = body; Store.commit('admin_notes', 'upsert', n); toast('Anotação salva.'); },
  module(f) { mustAdmin(); const m = getModule(f.dataset.m); const fd = new FormData(f); const t = String(fd.get('title') || '').trim(); if (!t) { toast('Informe o título.'); return; } m.title = t; m.summary = String(fd.get('summary') || '').trim(); m.published = !!fd.get('published'); Store.commit('modules', 'update', m); toast('Módulo salvo.'); render(); },
  lesson(f) {
    mustAdmin(); const l = getLesson(f.dataset.l); const fd = new FormData(f); const t = String(fd.get('title') || '').trim(); if (!t) { toast('Informe o título.'); return; }
    const newChecklist = toLines(fd.get('checklist'));
    Object.assign(l, { title: t, concept: String(fd.get('concept') || '').trim(), practice: String(fd.get('practice') || '').trim(), steps: toLines(fd.get('steps')), errors: toLines(fd.get('errors')), challenge: String(fd.get('challenge') || '').trim(), checklist: newChecklist });
    DB.progress.filter(p => p.lesson_id === l.id && p.status !== 'concluida').forEach(p => { p.checklist = newChecklist.map((_, i) => !!p.checklist[i]); if (p.status === 'aguardando' && !p.checklist.every(Boolean)) p.status = 'em_andamento'; API.writeProgress(p); });
    Store.commit('lessons', 'update', l); toast('Conteúdo salvo.'); go('#/admin/modulo/' + l.module_id);
  },
  material(f) { mustAdmin(); const fd = new FormData(f); const url = String(fd.get('url') || '').trim(); const title = String(fd.get('title') || '').trim(); if (!title || !/^https:\/\//i.test(url)) { toast('Informe título e um link que comece com https://'); return; } const a = { id: newId(), module_id: f.dataset.m, title, type: fd.get('type') || 'link', url, created_at: nowISO() }; DB.materials.push(a); Store.commit('materials', 'insert', a); toast('Material adicionado.'); render(); },
  entry(f) { mustAdmin(); const e = DB.library.find(x => x.id === f.dataset.id); const fd = new FormData(f); const t = String(fd.get('title') || '').trim(); if (!t) { toast('Informe o título.'); return; } Object.assign(e, { title: t, category: fd.get('category') || 'Diagnóstico', summary: String(fd.get('summary') || '').trim(), steps: toLines(fd.get('steps')), warning: String(fd.get('warning') || '').trim(), errors: toLines(fd.get('errors')), tags: String(fd.get('tags') || '').split(',').map(x => norm(x)).filter(Boolean) }); Store.commit('library_entries', 'update', e); toast('Ficha salva.'); UI.contentTab = 'biblioteca'; go('#/admin/conteudos'); },
  cohort(f) { const fd = new FormData(f); const name = String(fd.get('name') || '').trim(); if (!name) { toast('Informe o nome da turma.'); return; } API.saveCohort(f.dataset.id, { name, start_date: String(fd.get('start_date') || ''), location: String(fd.get('location') || '').trim(), schedule: String(fd.get('schedule') || '').trim(), total_hours: Number(fd.get('total_hours')) || 44, planned_meetings: Number(fd.get('planned_meetings')) || 11 }); toast('Turma salva.'); render(); },
  async encounter(f) {
    mustAdmin(); const fd = new FormData(f); const date = String(fd.get('date') || '');
    const participants = fd.getAll('participants');
    if (!date) { toast('Informe a data do encontro.'); return; }
    if (!participants.length) { toast('Selecione pelo menos um aluno.'); return; }
    const start = String(fd.get('start') || ''), end = String(fd.get('end') || '');
    if (start && end && end <= start) { toast('O horário de fim precisa ser depois do início.'); return; }
    const clash = conflictsFor(date, start, end, f.dataset.id || null);
    if (clash.length && !f.dataset.forced) {
      const who = clash.map(c => c.participants.map(studentName).join(', ')).join('; ');
      if (!(await confirmBox(`Já existe encontro nesse horário (${who}). Agendar mesmo assim?`, 'Agendar assim mesmo', false))) return;
    }
    const first = DB.students.find(x => x.id === participants[0]);
    const e = API.saveEncounter(f.dataset.id || null, { date, start, end, theme: String(fd.get('theme') || '').trim(), module_id: String(fd.get('module_id') || '') || null, status: String(fd.get('status') || 'agendado'), location: String(fd.get('location') || '').trim(), prep: String(fd.get('prep') || '').trim(), notes: String(fd.get('notes') || '').trim(), participants, cohort_id: f.dataset.cohort || (first && first.cohort_id) || (activeCohort() || {}).id });
    toast(f.dataset.id ? 'Encontro salvo.' : 'Encontro agendado.'); go('#/admin/encontro/' + e.id);
  },
  async schedule(f) {
    const fd = new FormData(f); const wds = fd.getAll('wd').map(Number); const start = String(fd.get('start') || ''), end = String(fd.get('end') || '');
    const from = String(fd.get('from') || ''); const count = Math.min(40, Math.max(1, Number(fd.get('count')) || 1));
    if (!wds.length || !from || !start || !end) { toast('Escolha os dias, a data inicial e o horário.'); return; }
    if (end <= start) { toast('O horário de fim precisa ser depois do início.'); return; }
    const n = API.buildSchedule(f.dataset.s, from, wds.map(wd => ({ wd, start, end })), count);
    const clashes = DB.encounters.filter(e => e.participants.includes(f.dataset.s)).filter(e => conflictsFor(e.date, e.start, e.end, e.id).length).length;
    toast(`${n} encontro(s) agendado(s).${clashes ? ` ${clashes} coincidem com outro aluno.` : ''}`); render();
  },
  'student-turma'(f) { mustAdmin(); const fd = new FormData(f); API.updateStudent(f.dataset.s, { cohort_id: String(fd.get('cohort_id') || ''), schedule: String(fd.get('schedule') || '').trim() }); toast('Turma e horário salvos.'); render(); },
  assessment(f) { mustAdmin(); const fd = new FormData(f); const title = String(fd.get('title') || '').trim(); const mid = String(fd.get('module_id') || ''); if (!title || !mid) { toast('Informe título e módulo.'); return; } const a = { id: newId(), title, module_id: mid, description: String(fd.get('description') || '').trim(), created_at: nowISO() }; DB.assessments.push(a); Store.commit('assessments', 'insert', a); toast('Avaliação adicionada.'); render(); },
  announcement(f) { mustAdmin(); const fd = new FormData(f); const title = String(fd.get('title') || '').trim(), body = String(fd.get('body') || '').trim(); if (!title || !body) { toast('Preencha título e mensagem.'); return; } const pinned = !!fd.get('pinned'); if (pinned) DB.announcements.forEach(x => { if (x.pinned) { x.pinned = false; Store.commit('announcements', 'update', x); } }); let a = f.dataset.id ? DB.announcements.find(x => x.id === f.dataset.id) : null; if (a) { Object.assign(a, { title, body, pinned }); Store.commit('announcements', 'update', a); } else { a = { id: newId(), title, body, pinned, created_at: nowISO() }; DB.announcements.push(a); Store.commit('announcements', 'insert', a); } UI.editAnn = null; toast('Aviso publicado.'); render(); }
};

// =================== Eventos ===================
function wireEvents() {
  document.addEventListener('click', async e => {
    const nav = e.target.closest('tr[data-go]'); if (nav) { go(nav.dataset.go); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const fn = ACTIONS[a.dataset.act]; if (!fn) return;
    e.preventDefault();
    try { await fn(a, e); }
    catch (err) { if (err instanceof Denied) toast(err.message); else { console.error(err); toast(err.message || 'Algo deu errado. Tente de novo.'); } }
  });
  document.addEventListener('keydown', e => {
    const tr = e.target.closest && e.target.closest('tr[data-go]');
    if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(tr.dataset.go); }
    if (e.target.id === 'ai-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover:hover)').matches) { e.preventDefault(); const f = e.target.form; if (f) f.requestSubmit(); }
  });
  document.addEventListener('submit', async e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const fn = FORMS[f.dataset.form]; if (!fn) return;
    try { await fn(f); }
    catch (err) { if (err instanceof Denied) toast(err.message); else { console.error(err); toast(err.message || 'Algo deu errado. Tente de novo.'); } }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.mask === 'phone') t.value = maskPhone(t.value);
    if (t.dataset && t.dataset.mask === 'cpf') t.value = maskCPF(t.value);
    if (t.dataset && t.dataset.live === 'lib') { UI.libQ = t.value; const r = $('#lib-results'); if (r) r.innerHTML = libResults(); }
    if (t.dataset && t.dataset.live === 'global') { const r = $('#search-results'); if (r) r.innerHTML = searchResults(t.value); }
    if (t.dataset && t.dataset.filter === 'q') { UI.af.q = t.value; const r = $('#stu-results'); if (r) r.innerHTML = studentResults(); }
    if (t.id === 'ai-input') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
    captureSignup(t);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    captureSignup(t);
    if (t.dataset && t.dataset.check) {
      try { API.toggleCheck(t.dataset.check, Number(t.dataset.i), t.checked); render(); }
      catch (err) { toast(err.message); render(); }
    }
    if (t.dataset && t.dataset.filter && t.dataset.filter !== 'q') { UI.af[t.dataset.filter] = t.value; render(); }
    if (t.dataset && t.dataset.status) { API.setStatus(t.dataset.status, t.value); toast('Situação atualizada.'); }
    if (t.dataset && t.dataset.avatar && t.files && t.files[0]) setAvatar(t.dataset.avatar, t.files[0]);
    const f = t.form;
    if (f && f.dataset.form === 'profile' && t.name === 'main_goal') {
      $$('input[name="secondary_goals"]', f).forEach(cb => { cb.disabled = cb.value === t.value; if (cb.disabled) cb.checked = false; });
    }
  });
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
}
function captureSignup(t) {
  const f = t.form; if (!f || f.dataset.form !== 'signup' || !t.name) return;
  const d = UI.su.d;
  if (t.type === 'checkbox' && t.name === 'secondary_goals') d.secondary_goals = $$('input[name="secondary_goals"]:checked', f).map(x => x.value);
  else if (t.type === 'checkbox') d[t.name] = t.checked;
  else if (t.type === 'radio') { if (t.checked) d[t.name] = t.value; if (t.name === 'main_goal') { d.secondary_goals = (d.secondary_goals || []).filter(g => g !== t.value); $$('input[name="secondary_goals"]', f).forEach(cb => { cb.disabled = cb.value === t.value; if (cb.disabled) cb.checked = false; }); } }
  else d[t.name] = t.value;
}

// =================== Foto de perfil (Supabase Storage) ===================
function setAvatar(sid, file) {
  if (!/^image\//.test(file.type)) { toast('Escolha um arquivo de imagem.'); return; }
  if (file.size > 8 * 1024 * 1024) { toast('Imagem muito grande. Use uma foto de até 8 MB.'); return; }
  UI.avatarBusy = true; render();
  const done = msg => { UI.avatarBusy = false; render(); if (msg) toast(msg); };
  const img = new Image(); const url = URL.createObjectURL(file);
  const fail = () => { URL.revokeObjectURL(url); done('Não foi possível ler a imagem. Tente outra foto.'); };
  const timer = setTimeout(fail, 15000);
  img.onload = () => {
    clearTimeout(timer);
    const size = 480, c = document.createElement('canvas'); c.width = c.height = size;
    const k = Math.max(size / img.width, size / img.height); const w = img.width * k, h = img.height * k;
    c.getContext('2d').drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
    URL.revokeObjectURL(url);
    c.toBlob(async blob => {
      if (!blob) { done('Não foi possível processar a imagem.'); return; }
      try {
        const path = AUTH_USER.id + '/avatar.jpg';
        const { error: upErr } = await sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '0' });
        if (upErr) throw upErr;
        const s = DB.students.find(x => x.id === sid);
        s.avatar_path = path; s.avatar = null;
        const { error: dbErr } = await sb.from('students').update({ avatar_path: path }).eq('id', sid);
        if (dbErr) throw dbErr;
        await ensureAvatar(s);
        done('Foto atualizada.');
      } catch (e) { done('Não foi possível salvar a foto agora. Tente de novo.'); }
    }, 'image/jpeg', 0.85);
  };
  img.onerror = () => { clearTimeout(timer); fail(); };
  img.src = url;
}

// =================== Capacidades do ambiente (IA, se algum dia estiver dentro do Claude) ===================
async function connectCapabilities() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { CAP.sampleState = 'off'; refreshCapViews(); return; }
  const [s, d] = await Promise.all([c.use('sample').catch(() => null), c.use('downloads').catch(() => null)]);
  CAP.sample = s || null; CAP.downloads = d || null; CAP.sampleState = s ? 'ready' : 'off';
  refreshCapViews();
}
function refreshCapViews() {
  const p = parseHash().path;
  if (!UI.aiBusy && (p === '/assistente' || p === '/admin/config')) render();
}

// =================== Início ===================
function fatal(msg) {
  const app = $('#app');
  if (app) app.innerHTML = `<div class="empty" style="margin:40px auto;max-width:520px"><h1>Não foi possível carregar</h1><p>${esc(msg)}</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn btn-gold" onclick="location.reload()">Tentar de novo</button></div></div>`;
}
let SEED_TRIED = false;
async function onAuthEvent(event, session) {
  try {
    if (event === 'PASSWORD_RECOVERY') { UI.passwordRecovery = true; render(); return; }
    if (event === 'SIGNED_OUT') { AUTH_USER = null; MY_ROLE = null; DB = emptyDB(); UI.passwordRecovery = false; render(); return; }
    await refreshAuth();
    if (AUTH_USER) {
      await loadAll();
      if (isAdmin() && !SEED_TRIED) {
        SEED_TRIED = true;
        try { const did = await seedContentIfEmpty(); if (did) toast('Trilha, Biblioteca e avaliações padrão da FORJA foram publicadas.'); }
        catch (e) { console.error('Não foi possível publicar o conteúdo inicial', e); toast('Não foi possível publicar o conteúdo inicial agora. Tente recarregar a página.'); }
      }
    } else { DB = emptyDB(); }
    render();
  } catch (e) {
    console.error(e);
    fatal('Não foi possível conectar ao banco agora. Confira sua internet e recarregue a página.');
  }
}
function boot() {
  applyTheme();
  if (!sb) { fatal('A conexão com o banco não foi configurada. Confira os valores no início do arquivo index.html.'); return; }
  DB = emptyDB();
  wireEvents();
  sb.auth.onAuthStateChange((event, session) => { onAuthEvent(event, session); });
  connectCapabilities();
}
window.addEventListener('error', e => { console.error(e.error || e.message); if (typeof toast === 'function' && DB) toast('Algo deu errado nesta tela. Se continuar, recarregue a página.'); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); if (typeof toast === 'function' && DB) toast('Uma ação não foi concluída. Tente de novo.'); });
try { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }
catch (e) { console.error(e); fatal('Houve um erro ao iniciar a plataforma. Recarregue a página.'); }

</script>
